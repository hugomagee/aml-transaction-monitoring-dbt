      tags: [hugo_rule]
    overrides:
      vars:
        pass_min_amount_usd: 1000
        pass_forward_ratio: 0.9
        pass_window_hours: 24
    given:
      - input: ref('int_edges')
        rows:
          - {txn_id: 1, txn_ts: "2022-09-01 08:00:00", src: "pt_S1", dst: "pt_M", amount_usd: 5000}
