  - name: test_rule_structuring_fixture
    model: rule_structuring
    description: "st_A: 3 sends in [9000,10000) within 72h alerts at the 3rd. st_B only 2; st_C spread over 8 days; st_D above threshold; st_E below band; st_F self-transfers: none alert."
    overrides:
      vars:
        structuring_threshold_usd: 10000
        structuring_band_pct: 0.1
        structuring_min_txns: 3
        structuring_window_hours: 72
    given:
      - input: ref('int_txn_enriched')
        rows:
          - {txn_id: 1, txn_ts: "2022-09-01 08:00:00", from_account_id: "st_A", amount_usd: 9500, is_self_transfer: false}
