version: 2

models:
  - name: dim_account
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('stg_accounts'), field: account_id}}
      - name: is_laundering_account
        data_tests: [not_null]
  - name: fct_transactions
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: from_account_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: to_account_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: amount_usd
        data_tests: [positive]
  - name: fct_account_split_label
    description: Per-split account labels; only transactions inside the split's window count.
    data_tests:
      - unique_combination_of_columns:
          arguments: {columns: [split, account_id]}
    columns:
      - name: split
        data_tests:
          - accepted_values: {arguments: {values: [all, tune, validate]}}
      - name: account_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: is_laundering_account
        data_tests: [not_null]
  - name: fct_alerts
    description: "Union of wired rules. Contract: rule_id, account_id, alert_ts, score, reason."
    columns:
      - name: rule_id
        data_tests: [not_null]
      - name: account_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_account'), field: account_id}}
      - name: alert_ts
        data_tests: [not_null]
      - name: score
        data_tests: [not_null]
      - name: reason
        data_tests: [not_null]
  - name: fct_rule_performance
    data_tests:
      - unique_combination_of_columns:
          arguments: {columns: [rule_id, split]}
    columns:
      - name: split
        data_tests:
          - accepted_values: {arguments: {values: [all, tune, validate]}}
  - name: fct_rule_pattern_recall
    data_tests:
      - unique_combination_of_columns:
          arguments: {columns: [rule_id, split, pattern_type]}
  - name: fct_rule_threshold_sensitivity
  - name: fct_rule_overlap
    data_tests:
      - unique_combination_of_columns:
          arguments: {columns: [rule_a, rule_b]}

unit_tests:
  - name: test_split_label_ignores_transactions_outside_window
    description: >
      cut = day 3. ac_early launders only on day 2 (tune label, no validate label).
      ac_late launders only on day 5: it must NOT be labelled in tune even though it is
      active in tune on day 1. ac_both launders on days 3 and 4. ac_clean never launders.
    model: fct_account_split_label
    overrides:
      vars:
        tune_last_day: 3
    given:
      - input: ref('int_account_activity_days')
        rows:
          - {account_id: ac_early, day_index: 2, n_txns: 2, n_laundering_txns: 1}
          - {account_id: ac_early, day_index: 5, n_txns: 1, n_laundering_txns: 0}
          - {account_id: ac_late, day_index: 1, n_txns: 3, n_laundering_txns: 0}
          - {account_id: ac_late, day_index: 5, n_txns: 2, n_laundering_txns: 1}
          - {account_id: ac_both, day_index: 3, n_txns: 1, n_laundering_txns: 1}
          - {account_id: ac_both, day_index: 4, n_txns: 1, n_laundering_txns: 1}
          - {account_id: ac_clean, day_index: 1, n_txns: 4, n_laundering_txns: 0}
    expect:
      rows:
        - {split: all,      account_id: ac_early, is_laundering_account: true}
        - {split: all,      account_id: ac_late,  is_laundering_account: true}
        - {split: all,      account_id: ac_both,  is_laundering_account: true}
        - {split: all,      account_id: ac_clean, is_laundering_account: false}
        - {split: tune,     account_id: ac_early, is_laundering_account: true}
        - {split: tune,     account_id: ac_late,  is_laundering_account: false}
        - {split: tune,     account_id: ac_both,  is_laundering_account: true}
        - {split: tune,     account_id: ac_clean, is_laundering_account: false}
        - {split: validate, account_id: ac_early, is_laundering_account: false}
        - {split: validate, account_id: ac_late,  is_laundering_account: true}
        - {split: validate, account_id: ac_both,  is_laundering_account: true}
