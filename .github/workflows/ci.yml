name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Committed ~100k-row sample (see ci/sample/MANIFEST.json); the full
      # dataset is never downloaded here.
      - name: Load CI sample
        run: AML_RAW_DIR=ci/sample AML_DB=data/ci.duckdb python scripts/load_raw.py hi
      # Rule fixtures run here too (none are tagged hugo_rule any more).
      - name: dbt build
        run: DBT_PROFILES_DIR=. AML_DB=data/ci.duckdb dbt build --exclude tag:hugo_rule
