name: aml_monitoring
version: "0.1.0"
config-version: 2
profile: aml_monitoring

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

vars:
  # Tune = days 1..tune_last_day, validate = the rest. See CLAUDE.md "Splits".
  tune_last_day: 7

clean-targets: ["target", "dbt_packages"]

models:
  aml_monitoring:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    harness:
      +materialized: table
      +schema: harness
    rules:
      +materialized: table
      +schema: rules

seeds:
  aml_monitoring:
    +schema: seeds
